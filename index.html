<style>
*{box-sizing:border-box}
html{
  scroll-behavior:smooth;
  background:#F3EEE3;
}
body{
  margin:0;
  padding:0;
  background:#F3EEE3;
  color:#302d28;
  font-family:"Noto Serif TC","Source Han Serif TC","Microsoft JhengHei",serif;
}
.site-nav{
  position:fixed;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  z-index:1000;
  width:178px;
  padding:14px 0 14px 14px;
  background:transparent;
}
.site-nav::before{
  content:"";
  position:absolute;
  left:24px;
  top:8px;
  bottom:8px;
  width:1px;
  background:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(80,76,68,.18) 7%,
    rgba(80,76,68,.30) 50%,
    rgba(80,76,68,.18) 93%,
    transparent 100%
  );
}
.nav-title{
  position:relative;
  margin:0 0 14px 42px;
  font-size:11px;
  letter-spacing:.16em;
  color:rgba(70,66,59,.68);
  white-space:nowrap;
}
.nav-item{
  position:relative;
  display:grid;
  grid-template-columns:20px 28px 1fr;
  align-items:center;
  min-height:37px;
  width:100%;
  padding:3px 6px 3px 0;
  color:rgba(55,51,45,.76);
  text-decoration:none;
  transition:color .25s ease, transform .25s ease;
}
.nav-item:hover{
  color:#7f5545;
  transform:translateX(3px);
}
.nav-dot{
  grid-column:1;
  justify-self:center;
  width:7px;
  height:7px;
  border:1px solid rgba(80,76,68,.42);
  border-radius:50%;
  background:rgba(243,238,227,.72);
  transition:all .25s ease;
}
.nav-num{
  grid-column:2;
  font-family:"Times New Roman","Noto Serif TC",serif;
  font-size:10px;
  letter-spacing:.04em;
  color:rgba(80,76,68,.58);
  white-space:nowrap;
}
.nav-label{
  grid-column:3;
  font-size:12px;
  letter-spacing:.06em;
  line-height:1.45;
  white-space:nowrap;
}
.nav-item.active{
  color:#9a5943;
}
.nav-item.active .nav-dot{
  width:9px;
  height:9px;
  border-color:#B66A4E;
  background:#B66A4E;
  box-shadow:0 0 0 4px rgba(182,106,78,.09);
}
.nav-item.active .nav-num{
  color:#B66A4E;
}
.nav-item.active .nav-label{
  font-weight:500;
}
.site-content{
  width:100%;
}
.scene{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:#F3EEE3;
  scroll-margin-top:0;
}
.scene-image-wrap{
  width:100%;
  max-width:1080px;
  line-height:0;
}
.scene-image{
  display:block;
  width:100%;
  height:auto;
  margin:0 auto;
}

.cover-email{top:44.5%;}
.channel-link{display:block;color:#4b463e;text-decoration:none;}
.channel-link:hover{color:#9a5943;text-decoration:underline;text-underline-offset:3px;}

.yt02-hit{

  left:12%;
  width:39%;
  height:6.5%;
}
.fb02-hit{

.fb-hit{top:79.0%;left:70%;width:24%;height:5.5%;}
@media (max-width:760px){

  .nav-num{font-size:9px}

  }
  .nav-item.active .nav-dot{width:7px;height:7px}

<script>
(function(){
  const items = Array.from(document.querySelectorAll('.nav-item'));
  const sections = Array.from(document.querySelectorAll('.scene'));

  function setActive(id){
    items.forEach(item => item.classList.toggle('active', item.dataset.target === id));
  }

  items.forEach(item => {
    item.addEventListener('click', () => setActive(item.dataset.target));
  });

  const observer = new IntersectionObserver((entries) => {
    const visible = entries
      .filter(e => e.isIntersecting)
      .sort((a,b) => b.intersectionRatio - a.intersectionRatio);
    if (visible.length) setActive(visible[0].target.id);
  }, {
    threshold:[0.15,0.35,0.55,0.75],
    rootMargin:"-8% 0px -42% 0px"
  });

  sections.forEach(section => observer.observe(section));
  setActive('cover');
})();
</script>
