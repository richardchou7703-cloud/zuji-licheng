<style>
*{box-sizing:border-box}
html{

body{

/* === 桌機左側固定導覽列 === */
.site-nav{
  position:fixed;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  z-index:1000;
  width:178px;
  padding:14px 0 14px 14px;
  background:transparent;
}
.site-nav::before{
  content:"";
  position:absolute;
  left:24px;
  top:8px;
  bottom:8px;
  width:1px;
  background:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(80,76,68,.18) 7%,
    rgba(80,76,68,.30) 50%,
    rgba(80,76,68,.18) 93%,
    transparent 100%
  );
}
.nav-title{
  position:relative;
  margin:0 0 14px 42px;
  font-size:11px;
  letter-spacing:.16em;
  color:rgba(70,66,59,.68);
  white-space:nowrap;
}
.nav-items-container{
  display:contents;
}
.nav-item{
  position:relative;
  display:grid;
  grid-template-columns:20px 28px 1fr;
  align-items:center;
  min-height:37px;
  width:100%;
  padding:3px 6px 3px 0;
  color:rgba(55,51,45,.76);
  text-decoration:none;
  transition:color .25s ease, transform .25s ease;
  -webkit-tap-highlight-color:rgba(182,106,78,.15);
}
.nav-item:hover{
  color:#7f5545;
  transform:translateX(3px);
}
.nav-dot{
  grid-column:1;
  justify-self:center;
  width:7px;
  height:7px;
  border:1px solid rgba(80,76,68,.42);
  border-radius:50%;
  background:rgba(243,238,227,.72);
  transition:all .25s ease;
  flex-shrink:0;
}
.nav-num{
  grid-column:2;
  font-family:"Times New Roman","Noto Serif TC",serif;
  font-size:10px;
  letter-spacing:.04em;
  color:rgba(80,76,68,.58);
  white-space:nowrap;
}
.nav-label{
  grid-column:3;
  font-size:12px;
  letter-spacing:.06em;
  line-height:1.45;
  white-space:nowrap;
}
.nav-item.active{
  color:#9a5943;
}
.nav-item.active .nav-dot{
  width:9px;
  height:9px;
  border-color:#B66A4E;
  background:#B66A4E;
  box-shadow:0 0 0 4px rgba(182,106,78,.12);
}
.nav-item.active .nav-num{
  color:#B66A4E;
  font-weight:600;
}
.nav-item.active .nav-label{
  font-weight:600;
}

.contact-overlay:active{

  align-items:center;

  cursor:pointer;
  opacity:0;

  transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);

}
.back-to-top.visible{

  transform:translateY(0);
}

  color:#F3EEE3;

<!-- 返回頂部浮動按鈕 -->
<button class="back-to-top" id="backToTop" aria-label="返回頁首" title="返回頁首">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 4l-8 8h5v8h6v-8h5z"/>
  </svg>
</button>

<script>
(function(){
  const navContainer = document.querySelector('.site-nav');
  const items = Array.from(document.querySelectorAll('.nav-item'));
  const sections = Array.from(document.querySelectorAll('.scene'));
  const backToTopBtn = document.getElementById('backToTop');

  function setActive(id){
    items.forEach(item => {
      const isActive = item.dataset.target === id;
      item.classList.toggle('active', isActive);
      if (isActive && window.innerWidth <= 860 && navContainer) {
        item.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    });
  }

  items.forEach(item => {
    item.addEventListener('click', (e) => {
      const targetId = item.dataset.target;
      const targetEl = document.getElementById(targetId);
      if (targetEl) {
        e.preventDefault();
        targetEl.scrollIntoView({ behavior: 'smooth' });
        setActive(targetId);
      }
    });
  });

  // 返回頂部功能
  if (backToTopBtn) {
    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) {
        backToTopBtn.classList.add('visible');
      } else {
        backToTopBtn.classList.remove('visible');
      }
    }, { passive: true });
  }

  // 滾動觀察器高亮當前章節
  const observer = new IntersectionObserver((entries) => {
    const visible = entries
      .filter(e => e.isIntersecting)
      .sort((a,b) => b.intersectionRatio - a.intersectionRatio);
    if (visible.length) setActive(visible[0].target.id);
  }, {
    threshold:[0.15, 0.35, 0.55, 0.75],
    rootMargin:"-10% 0px -40% 0px"
  });

  sections.forEach(section => observer.observe(section));
  setActive('cover');
})();
</script>
